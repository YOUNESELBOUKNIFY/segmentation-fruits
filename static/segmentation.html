<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Segmentation </title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #00ffff;
    --primary-dark: #00e0e0;
    --bg: #0d1b2a;
    --bg-dark: #1b263b;
    --card-bg: rgba(0,0,0,0.6);
    --text: #fff;
    --accent: #2196f3;
  }
  * { box-sizing: border-box; font-family: 'Baloo 2', cursive; }
  body {
    margin: 0;
    background: linear-gradient(135deg, var(--bg), var(--bg-dark));
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    text-align: center;
  }

  header {
    padding: 50px 20px;
    color: var(--primary);
    text-shadow: 2px 2px 8px rgba(0,255,255,0.4);
    font-size: 36px;
    animation: fadeIn 1.5s ease;
  }

  main {
    flex: 1;
    width: 100%;
    max-width: 1000px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }

  form {
    background-color: var(--card-bg);
    padding: 30px 40px;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 30px;
    transition: transform 0.3s ease;
  }
  form:hover { transform: scale(1.02); }
  form input[type="file"] {
    margin-bottom: 15px;
    padding: 10px;
    border-radius: 10px;
    border: 2px dashed var(--primary);
    background-color: rgba(255,255,255,0.1);
    cursor: pointer;
    color: var(--text);
  }
  form button {
    background-color: var(--primary);
    color: var(--bg);
    border: none;
    padding: 12px 30px;
    border-radius: 50px;
    font-size: 18px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.3s ease;
    box-shadow: 0 6px 18px rgba(0,255,255,0.4);
  }
  form button:hover {
    background-color: var(--primary-dark);
    transform: scale(1.05);
  }

  #loader {
    display: none;
    margin-top: 20px;
    font-size: 18px;
    color: var(--accent);
    font-weight: bold;
  }
  #loader::after { content: "⏳"; margin-left: 8px; animation: spin 1.5s linear infinite; }

  #resultContainer {
    display: none;
    width: 100%;
    text-align: center;
  }
  .images {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 25px;
    margin-bottom: 20px;
  }
  .card {
    background-color: var(--card-bg);
    padding: 15px;
    border-radius: 20px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.5);
    transition: transform 0.3s ease;
  }
  .card:hover { transform: scale(1.02); }
  .card h4 { margin-bottom: 10px; color: var(--primary); }
  img, canvas { max-width: 400px; max-height: 400px; border-radius: 10px; }

  #objectsList {
    list-style: none;
    padding: 0;
    margin: 20px auto;
    display: inline-block;
    text-align: left;
  }
  #objectsList li {
    background: rgba(0,255,255,0.1);
    padding: 8px 12px;
    margin: 5px 0;
    border-radius: 8px;
    border-left: 5px solid var(--primary);
    font-size: 16px;
    animation: fadeIn 0.6s ease;
  }

  #downloadBtn {
    padding: 12px 25px;
    background-color: var(--accent);
    color: white;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.3s ease;
    margin-bottom: 20px;
    box-shadow: 0 5px 15px rgba(33,150,243,0.5);
  }
  #downloadBtn:hover {
    background-color: #1976d2;
    transform: scale(1.05);
  }

  footer {
    text-align: center;
    padding: 15px;
    font-size: 14px;
    color: var(--primary);
  }

  @keyframes fadeIn { from {opacity:0; transform:translateY(20px);} to {opacity:1; transform:translateY(0);} }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>
  <header>Segmentation des Fruits </header>

  <main>
    <form id="uploadForm">
      <input type="file" id="fileInput" accept="image/*" />
      <button type="submit" id="analyzeBtn">Analyser l'image</button>
    </form>

    <div id="loader">Analyse en cours...</div>

    <div id="resultContainer">
      <div class="images">
        <div class="card">
          <h4>Image originale</h4>
          <img id="originalImage" src="" />
        </div>
        <div class="card">
          <h4>Résultat de segmentation</h4>
          <canvas id="canvas"></canvas>
        </div>
      </div>
      <button id="downloadBtn"> Télécharger le résultat</button>

      <h3 style="color:var(--primary); margin-top:20px;">Objets détectés :</h3>
      <ul id="objectsList"></ul>
    </div>
  </main>

  <footer>&copy; 2025 YOUNES ELBOUKNIFY — Projet éducatif de segmentation de fruits</footer>

  <script>
    const COLORS = ["rgba(255,0,0,0.4)","rgba(0,255,0,0.4)","rgba(0,0,255,0.4)","rgba(255,255,0,0.4)","rgba(255,0,255,0.4)","rgba(0,255,255,0.4)"];

    const form = document.getElementById("uploadForm");
    const loader = document.getElementById("loader");
    const resultContainer = document.getElementById("resultContainer");
    const originalImage = document.getElementById("originalImage");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const downloadBtn = document.getElementById("downloadBtn");
    const objectsList = document.getElementById("objectsList");
    const fileInput = document.getElementById("fileInput");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const file = fileInput.files[0];
      if (!file) return alert("Veuillez sélectionner une image 📷");

      loader.style.display = "block";
      resultContainer.style.display = "none";
      objectsList.innerHTML = "";

      const formData = new FormData();
      formData.append("file", file);

      try {
        const response = await fetch("http://127.0.0.1:8000/predict", { method:"POST", body: formData });
        const data = await response.json();
        drawResult(data, file);
      } catch(err) { console.error(err); alert("Erreur lors de l'analyse de l'image ⚠️"); }
      finally { loader.style.display = "none"; }
    });

    function drawResult(result, file) {
      if (!result.predictions) return;
      const img = new Image();
      img.src = URL.createObjectURL(file);

      img.onload = () => {
        const w = result.image.width, h = result.image.height;
        const maxW = 400;
        const scale = Math.min(1, maxW / w);
        canvas.width = w*scale;
        canvas.height = h*scale;

        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img,0,0,canvas.width,canvas.height);

        result.predictions.forEach((pred,i)=>{
          const color = COLORS[i%COLORS.length];
          ctx.beginPath();
          pred.points.forEach((p,j)=>{
            j===0?ctx.moveTo(p.x*scale,p.y*scale):ctx.lineTo(p.x*scale,p.y*scale);
          });
          ctx.closePath();
          ctx.fillStyle=color; ctx.fill();
          ctx.strokeStyle=color.replace("0.4","1"); ctx.lineWidth=2; ctx.stroke();
        });

        result.predictions.forEach((pred,i)=>{
          const li = document.createElement("li");
          li.innerHTML=`<span style="display:inline-block;width:16px;height:16px;background-color:${COLORS[i%COLORS.length]};border-radius:4px;margin-right:8px;"></span>
                        <strong>${pred.class}</strong> — ${(pred.confidence*100).toFixed(1)}%`;
          objectsList.appendChild(li);
        });

        originalImage.src=img.src;
        resultContainer.style.display="block";
      };
    }

    downloadBtn.addEventListener("click",()=>{
      const link=document.createElement("a");
      link.download="segmentation_result.png";
      link.href=canvas.toDataURL("image/png");
      link.click();
    });
  </script>
</body>
</html>
